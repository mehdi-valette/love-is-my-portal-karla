services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    working_dir: /usr/src/karla
    command: php -S 0.0.0.0:8080
    volumes:
      - ./src:/usr/src/karla
      - ./externals/karla.conf:/etc/karla/karla.conf
      - ./externals/reviews.db:/var/lib/karla/reviews.db
